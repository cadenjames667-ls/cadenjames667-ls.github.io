<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Furnder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f0eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    header h1 { font-size: 1.6rem; font-weight: 800; color: #c0392b; letter-spacing: -0.5px; }
    header h1 span { color: #333; }

    nav button {
      background: none;
      border: 2px solid #ddd;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      margin-left: 8px;
      transition: all 0.15s;
      color: #555;
      font-weight: 500;
    }

    nav button:hover, nav button.active {
      border-color: #c0392b;
      color: #c0392b;
      background: #fff5f5;
    }

    /* ── VIEWS ── */
    .view { display: none; width: 100%; max-width: 480px; padding: 24px 16px; }
    .view.active { display: flex; flex-direction: column; align-items: center; }

    /* ── SWIPE VIEW ── */
    #card-stack {
      width: 100%;
      position: relative;
      height: 420px;
      margin-bottom: 24px;
    }

    .card {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, opacity 0.15s ease;
      cursor: grab;
      user-select: none;
    }

    .card:active { cursor: grabbing; }

    .card img {
      width: 100%;
      flex: 1;
      object-fit: cover;
      pointer-events: none;
    }

    .card .card-info { padding: 14px 18px; background: #fff; }
    .card .card-info h2 { font-size: 1.05rem; font-weight: 700; color: #222; margin-bottom: 4px; }
    .card .card-info p  { font-size: 0.8rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .card .card-source {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      color: #c0392b;
      font-weight: 600;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stamp {
      position: absolute;
      top: 28px;
      font-size: 2.4rem;
      font-weight: 900;
      border: 5px solid;
      border-radius: 10px;
      padding: 4px 14px;
      opacity: 0;
      transform: rotate(-20deg);
      pointer-events: none;
      transition: opacity 0.1s;
      z-index: 10;
    }

    .stamp.like    { left: 20px;  color: #27ae60; border-color: #27ae60; transform: rotate(-15deg); }
    .stamp.dislike { right: 20px; color: #e74c3c; border-color: #e74c3c; transform: rotate(15deg);  }

    .card.going-right .stamp.like,
    .card.going-left  .stamp.dislike { opacity: 1; }

    .empty-state {
      width: 100%; height: 420px;
      border-radius: 20px; background: #fff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #aaa; font-size: 1rem; gap: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .empty-state .big { font-size: 3rem; }

    .action-btns { display: flex; gap: 32px; margin-top: 8px; }

    .action-btns button {
      width: 68px; height: 68px;
      border-radius: 50%; border: none;
      font-size: 1.8rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .action-btns button:hover  { transform: scale(1.08); box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
    .action-btns button:active { transform: scale(0.96); }
    #btn-dislike { background: #fff; color: #e74c3c; }
    #btn-like    { background: #fff; color: #27ae60; }

    /* ── ADD VIEW ── */
    #view-add { gap: 16px; }

    .form-group { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: #555; }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    .form-group input:focus, .form-group textarea:focus { border-color: #c0392b; }
    .form-group textarea { resize: vertical; min-height: 80px; }

    .url-hint {
      font-size: 0.76rem;
      color: #aaa;
      margin-top: -4px;
    }

    /* URL fetch state row */
    .fetch-status {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #888;
      min-height: 20px;
      width: 100%;
    }
    .fetch-status.visible { display: flex; }
    .fetch-status.ok   { color: #27ae60; }
    .fetch-status.fail { color: #e67e22; }

    /* Preview box */
    .preview-box {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      display: none;
      border: 2px solid #eee;
      background: #fafafa;
      flex-direction: column;
    }
    .preview-box.visible { display: flex; }

    .preview-box img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
    }

    .preview-box .preview-meta {
      padding: 10px 14px;
      font-size: 0.82rem;
      color: #555;
      border-top: 1px solid #eee;
    }

    .preview-box .preview-meta strong {
      display: block;
      color: #222;
      font-size: 0.88rem;
      margin-bottom: 2px;
    }

    #btn-add-item {
      width: 100%;
      padding: 14px;
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 4px;
    }

    #btn-add-item:hover { background: #a93226; }
    #btn-add-item:active { transform: scale(0.98); }
    #btn-add-item:disabled { background: #ccc; cursor: not-allowed; }

    .msg { font-size: 0.85rem; color: #27ae60; text-align: center; min-height: 20px; }
    .msg.error { color: #e74c3c; }

    /* ── LIKED VIEW ── */
    #view-liked { gap: 16px; }

    #liked-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .liked-card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.09);
      display: flex;
      flex-direction: column;
    }

    .liked-card img { width: 100%; height: 140px; object-fit: cover; }

    .liked-card .liked-info {
      padding: 10px 12px; flex: 1;
      display: flex; flex-direction: column; gap: 4px;
    }

    .liked-card .liked-info h3 { font-size: 0.9rem;  font-weight: 700; color: #222; }
    .liked-card .liked-info p  { font-size: 0.75rem; color: #888; }

    .liked-card .liked-info a {
      font-size: 0.75rem;
      color: #c0392b;
      text-decoration: none;
      margin-top: auto;
      padding-top: 4px;
      font-weight: 600;
    }

    .liked-card .liked-info a:hover { text-decoration: underline; }

    .no-liked { width: 100%; padding: 48px 0; text-align: center; color: #aaa; font-size: 0.95rem; }

    /* ── LOADING ── */
    .spinner {
      width: 36px; height: 36px;
      border: 4px solid #eee;
      border-top-color: #c0392b;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .spinner.sm {
      width: 16px; height: 16px;
      border-width: 2px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<script type="module">
  import { initializeApp }           from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getFirestore, collection,
           addDoc, getDocs, doc,
           updateDoc, query, where,
           orderBy }                 from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  const FIREBASE_CONFIG = {
    apiKey:            "AIzaSyDI6IKYN4UxzSnWRsyPWc3micI67xI9r2c",
    authDomain:        "furnder-3442a.firebaseapp.com",
    projectId:         "furnder-3442a",
    storageBucket:     "furnder-3442a.firebasestorage.app",
    messagingSenderId: "66710627264",
    appId:             "1:66710627264:web:22aa22c6d85bc39dd11e25",
    measurementId:     "G-4KMKLD0VKL"
  };

  const app = initializeApp(FIREBASE_CONFIG);
  const db  = getFirestore(app);

  // ── State ──
  let deck     = [];
  let topCard  = null;
  let startX   = 0, currentX = 0, dragging = false;
  let fetchedImageUrl = "";   // OG image pulled from product page
  let fetchTimer = null;

  // ── Elements ──
  const stack       = document.getElementById("card-stack");
  const btnLike     = document.getElementById("btn-like");
  const btnDislike  = document.getElementById("btn-dislike");
  const addMsg      = document.getElementById("add-msg");
  const likedGrid   = document.getElementById("liked-grid");
  const urlInput    = document.getElementById("input-url");
  const nameInput   = document.getElementById("input-name");
  const descInput   = document.getElementById("input-desc");
  const fetchStatus = document.getElementById("fetch-status");
  const previewBox  = document.getElementById("preview-box");
  const previewImg  = document.getElementById("preview-img");
  const previewMeta = document.getElementById("preview-meta");

  // ── Navigation ──
  document.querySelectorAll("[data-view]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.view;
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.getElementById("view-" + id).classList.add("active");
      document.querySelectorAll("[data-view]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      if (id === "liked") loadLiked();
    });
  });

  // ── URL input → fetch OG metadata ──
  urlInput.addEventListener("input", () => {
    clearTimeout(fetchTimer);
    const val = urlInput.value.trim();
    if (!val) { resetPreview(); return; }
    fetchTimer = setTimeout(() => fetchProductMeta(val), 600);
  });

  async function fetchProductMeta(url) {
    fetchedImageUrl = "";
    previewBox.classList.remove("visible");
    fetchStatus.className = "fetch-status visible";
    fetchStatus.innerHTML = `<div class="spinner sm"></div> Fetching product info…`;

    try {
      const res  = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(url)}`);
      const json = await res.json();

      if (json.status !== "success") throw new Error("No data");

      const { title, description, image } = json.data ?? {};

      fetchedImageUrl = image?.url ?? "";

      // Auto-fill name from OG title (strip trailing site name after | or —)
      if (title && !nameInput.value.trim()) {
        const clean = title.replace(/\s*[\|—–-]\s*(wayfair|ikea|amazon|target|pottery barn|crate.?&.?barrel|west elm|cb2|article|joss.?&.?main|allmodern|birch lane|perigold|overstock|houzz|room.?&.?board|restoration hardware|rh|home depot|lowe'?s)[^]*$/i, "").trim();
        nameInput.value = clean || title;
      }

      if (fetchedImageUrl) {
        previewImg.src = fetchedImageUrl;
        previewMeta.innerHTML = `<strong>${escHtml(nameInput.value || title || "")}</strong>${description ? escHtml(description.slice(0, 80)) + "…" : ""}`;
        previewBox.classList.add("visible");
        fetchStatus.className = "fetch-status ok";
        fetchStatus.textContent = "✓ Product info loaded";
      } else {
        fetchStatus.className = "fetch-status fail";
        fetchStatus.textContent = "⚠ No image found — you can still add it";
      }
    } catch {
      fetchStatus.className = "fetch-status fail";
      fetchStatus.textContent = "⚠ Couldn't load preview — you can still add it";
    }
  }

  function resetPreview() {
    fetchedImageUrl = "";
    fetchStatus.className = "fetch-status";
    previewBox.classList.remove("visible");
  }

  // ── Add item ──
  document.getElementById("btn-add-item").addEventListener("click", async () => {
    const productUrl = urlInput.value.trim();
    const name       = nameInput.value.trim() || "Untitled";
    const desc       = descInput.value.trim();

    if (!productUrl) { showMsg("Paste a product page URL first.", true); return; }

    const btn = document.getElementById("btn-add-item");
    btn.disabled = true;
    btn.textContent = "Adding…";

    try {
      // If we haven't fetched yet (user clicked fast), try now
      let imgUrl = fetchedImageUrl;
      if (!imgUrl && productUrl) {
        try {
          const r = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(productUrl)}`);
          const j = await r.json();
          imgUrl = j.data?.image?.url ?? "";
        } catch { /* silent */ }
      }

      await addDoc(collection(db, "furniture"), {
        productUrl,
        imageUrl:    imgUrl,
        name,
        description: desc,
        swiped:      false,
        liked:       false,
        addedAt:     Date.now()
      });

      showMsg("Added! ✓");
      urlInput.value = nameInput.value = descInput.value = "";
      resetPreview();
    } catch (e) {
      showMsg("Error: " + e.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = "Add Furniture";
    }
  });

  function showMsg(text, isError = false) {
    addMsg.textContent = text;
    addMsg.className   = "msg" + (isError ? " error" : "");
    setTimeout(() => { addMsg.textContent = ""; }, 3500);
  }

  // ── Load swipe deck ──
  async function loadDeck() {
    stack.innerHTML = `<div class="empty-state"><div class="spinner"></div></div>`;
    const snap = await getDocs(query(collection(db, "furniture"), orderBy("addedAt", "desc")));
    deck = [];
    snap.forEach(d => {
      const data = d.data();
      if (!data.swiped) deck.push({ id: d.id, ...data });
    });
    renderDeck();
  }

  function renderDeck() {
    stack.innerHTML = "";
    if (deck.length === 0) {
      stack.innerHTML = `<div class="empty-state"><div class="big">🛋️</div><div>No more furniture!</div><div style="font-size:0.8rem">Add items in the Add tab</div></div>`;
      return;
    }
    for (let i = Math.min(deck.length - 1, 2); i >= 1; i--) {
      const ghost = makeCardEl(deck[i]);
      ghost.style.transform    = `scale(${0.94 + i * 0.02}) translateY(${(2 - i) * 10}px)`;
      ghost.style.zIndex       = i;
      ghost.style.pointerEvents = "none";
      ghost.style.filter       = "brightness(0.97)";
      stack.appendChild(ghost);
    }
    topCard = makeCardEl(deck[0]);
    topCard.style.zIndex = 10;
    stack.appendChild(topCard);
    addDragListeners(topCard);
  }

  function makeCardEl(item) {
    // Support old records that stored url directly as the image
    const imgSrc     = item.imageUrl || item.url || "";
    const productUrl = item.productUrl || item.url || "";
    const domain     = productUrl ? (() => { try { return new URL(productUrl).hostname.replace(/^www\./, ""); } catch { return ""; } })() : "";

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="stamp like">LIKE</div>
      <div class="stamp dislike">NOPE</div>
      ${imgSrc
        ? `<img src="${escHtml(imgSrc)}" alt="${escHtml(item.name)}" onerror="this.style.display='none'">`
        : `<div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:3rem;background:#f5f0eb;">🛋️</div>`
      }
      <div class="card-info">
        ${domain ? `<div class="card-source">🔗 ${escHtml(domain)}</div>` : ""}
        <h2>${escHtml(item.name)}</h2>
        <p>${escHtml(item.description || domain || "")}</p>
      </div>`;
    return card;
  }

  // ── Drag ──
  function addDragListeners(card) {
    card.addEventListener("mousedown",  e => onStart(e.clientX));
    card.addEventListener("touchstart", e => onStart(e.touches[0].clientX), { passive: true });
    window.addEventListener("mousemove",  e => onMove(e.clientX));
    window.addEventListener("touchmove",  e => onMove(e.touches[0].clientX), { passive: true });
    window.addEventListener("mouseup",  onEnd);
    window.addEventListener("touchend", onEnd);
  }

  function onStart(x) { dragging = true; startX = x; currentX = x; }

  function onMove(x) {
    if (!dragging || !topCard) return;
    currentX = x;
    const dx = currentX - startX;
    topCard.style.transform = `translateX(${dx}px) rotate(${dx * 0.08}deg)`;
    topCard.classList.toggle("going-right", dx > 40);
    topCard.classList.toggle("going-left",  dx < -40);
  }

  function onEnd() {
    if (!dragging || !topCard) return;
    dragging = false;
    const dx = currentX - startX;
    if      (dx >  100) animateSwipe("right");
    else if (dx < -100) animateSwipe("left");
    else {
      topCard.style.transform = "";
      topCard.classList.remove("going-right", "going-left");
    }
  }

  function animateSwipe(dir) {
    if (!topCard) return;
    const card = topCard; topCard = null;
    card.style.transition = "transform 0.35s ease, opacity 0.35s ease";
    card.style.transform  = `translateX(${dir === "right" ? 600 : -600}px) rotate(${dir === "right" ? 20 : -20}deg)`;
    card.style.opacity    = "0";
    const item = deck.shift();
    recordSwipe(item.id, dir === "right");
    setTimeout(() => { card.remove(); renderDeck(); }, 360);
  }

  btnLike.addEventListener("click",    () => { if (deck.length) animateSwipe("right"); });
  btnDislike.addEventListener("click", () => { if (deck.length) animateSwipe("left");  });

  document.addEventListener("keydown", e => {
    if (document.getElementById("view-swipe").classList.contains("active")) {
      if (e.key === "ArrowRight") btnLike.click();
      if (e.key === "ArrowLeft")  btnDislike.click();
    }
  });

  async function recordSwipe(id, liked) {
    await updateDoc(doc(db, "furniture", id), { swiped: true, liked });
  }

  // ── Liked items ──
  async function loadLiked() {
    likedGrid.innerHTML = `<div class="spinner" style="margin:32px auto;grid-column:1/-1"></div>`;
    const snap = await getDocs(query(collection(db, "furniture"), where("liked", "==", true)));

    if (snap.empty) {
      likedGrid.innerHTML = `<div class="no-liked">No liked items yet — start swiping!</div>`;
      return;
    }

    likedGrid.innerHTML = "";
    snap.forEach(d => {
      const item       = d.data();
      const imgSrc     = item.imageUrl || item.url || "";
      const productUrl = item.productUrl || item.url || "";
      const domain     = productUrl ? (() => { try { return new URL(productUrl).hostname.replace(/^www\./, ""); } catch { return ""; } })() : "";

      const el = document.createElement("div");
      el.className = "liked-card";
      el.innerHTML = `
        ${imgSrc
          ? `<img src="${escHtml(imgSrc)}" alt="${escHtml(item.name)}" onerror="this.style.display='none'">`
          : `<div style="height:140px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;background:#f5f0eb;">🛋️</div>`
        }
        <div class="liked-info">
          <h3>${escHtml(item.name)}</h3>
          ${item.description ? `<p>${escHtml(item.description)}</p>` : ""}
          ${productUrl ? `<a href="${escHtml(productUrl)}" target="_blank" rel="noopener">View on ${escHtml(domain || "site")} ↗</a>` : ""}
        </div>`;
      likedGrid.appendChild(el);
    });
  }

  function escHtml(str) {
    return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  loadDeck();
</script>

<header>
  <h1>Furn<span>der</span></h1>
  <nav>
    <button data-view="swipe" class="active">Swipe</button>
    <button data-view="add">+ Add</button>
    <button data-view="liked">❤️ Liked</button>
  </nav>
</header>

<!-- SWIPE VIEW -->
<div id="view-swipe" class="view active">
  <div id="card-stack"></div>
  <div class="action-btns">
    <button id="btn-dislike" title="Dislike (←)">✕</button>
    <button id="btn-like"    title="Like (→)">♥</button>
  </div>
</div>

<!-- ADD VIEW -->
<div id="view-add" class="view">
  <div class="form-group">
    <label for="input-url">Product Page URL *</label>
    <input id="input-url" type="url" placeholder="https://www.wayfair.com/furniture/…" />
    <span class="url-hint">Paste any link from Wayfair, IKEA, Amazon, Target, and more — the image and name will load automatically.</span>
  </div>

  <div id="fetch-status" class="fetch-status"></div>

  <div id="preview-box" class="preview-box">
    <img id="preview-img" alt="Product preview" />
    <div class="preview-meta" id="preview-meta"></div>
  </div>

  <div class="form-group">
    <label for="input-name">Name <span style="font-weight:400;color:#aaa">(auto-filled)</span></label>
    <input id="input-name" type="text" placeholder="Mid-century sofa" />
  </div>
  <div class="form-group">
    <label for="input-desc">Notes</label>
    <textarea id="input-desc" placeholder="Color, size, why you love it…"></textarea>
  </div>
  <button id="btn-add-item">Add Furniture</button>
  <div id="add-msg" class="msg"></div>
</div>

<!-- LIKED VIEW -->
<div id="view-liked" class="view">
  <div id="liked-grid"></div>
</div>

</body>
</html>
