<script>
// ============== EASY POOL (definition-recognition style) ==============
const EASY_QUESTIONS = [
  { id: 1, category: "Federalism", question: "Which constitutional rule states that valid federal law defeats conflicting state law?", options: ["The Necessary and Proper Clause", "The Commerce Clause", "The Supremacy Clause", "The Tenth Amendment"], correct: 2, explanation: "The Supremacy Clause (Article VI) makes valid federal law the supreme law of the land, overriding conflicting state law. This was a Bingo Review clue." },
  { id: 2, category: "Federalism", question: "Powers specifically listed for the national government, such as coining money and regulating interstate commerce, are called:", options: ["Reserved powers", "Enumerated powers", "Concurrent powers", "Police powers"], correct: 1, explanation: "Enumerated powers are those expressly listed in the Constitution for the national government. Bingo Review term." },
  { id: 3, category: "Federalism", question: "The state authority to regulate for the health, safety, and welfare of residents is called:", options: ["Reserved powers", "Concurrent powers", "Police powers", "Implied powers"], correct: 2, explanation: "Police powers are the broad state authority to regulate for health, safety, and welfare. Lottery and casino gambling decisions are classic examples. Bingo Review term." },
  { id: 4, category: "Federalism", question: "Which 1819 Supreme Court case defended implied federal powers and rejected state taxation of a valid federal institution (the national bank)?", options: ["Gibbons v. Ogden", "Marbury v. Madison", "McCulloch v. Maryland", "Wickard v. Filburn"], correct: 2, explanation: "McCulloch v. Maryland (1819) established implied federal powers via the Necessary and Proper Clause and ruled states cannot tax legitimate federal institutions. Bingo Review term." },
  { id: 5, category: "Federalism", question: "When a higher level of government requires a policy but does not provide enough money to cover the cost, this is called a(n):", options: ["Categorical grant", "Block grant", "Unfunded mandate", "Matching requirement"], correct: 2, explanation: "Unfunded mandates require states or localities to take action without sufficient funding. Bingo Review term." },
  { id: 6, category: "Federalism", question: "Which type of federal grant gives state and local governments broad discretion and the fewest restrictions on how funds are spent?", options: ["Categorical grants", "Block grants", "Matching grants", "Project grants"], correct: 1, explanation: "Block grants give recipients broad discretion. Categorical grants come with strict conditions. TANF is an example of a block grant. Bingo Review term." },
  { id: 7, category: "Federalism", question: "A system that gives lower-level governments most authority and lets them significantly limit the national government is known as:", options: ["Unitary government", "Federalism", "Confederation", "Devolution"], correct: 2, explanation: "A confederation gives subnational governments most authority. The Articles of Confederation are the U.S. example before the Constitution. Bingo Review term." },

  { id: 8, category: "Local Government & Metro Politics", question: "The doctrine that limits local government to powers expressly granted by the state or closely implied by those grants is known as:", options: ["Home Rule", "Dillon's Rule", "The Tiebout Model", "Cooley Doctrine"], correct: 1, explanation: "Dillon's Rule limits local governments to powers expressly granted by the state. Bingo Review term." },
  { id: 9, category: "Local Government & Metro Politics", question: "Which provision gives a city broader authority to govern itself so long as it does not conflict with state law?", options: ["General law", "Home rule", "Dillon's Rule", "Police powers"], correct: 1, explanation: "Home rule allows cities to adopt their own charter and pass ordinances so long as they don't conflict with state or federal law. In Texas, cities over 5,000 may adopt home rule. Bingo Review term." },
  { id: 10, category: "Local Government & Metro Politics", question: "In which city form do voters elect a council and mayor, and the council hires a professional administrator to run day-to-day government?", options: ["Strong mayor system", "Weak mayor system", "Council-manager system", "Commission system"], correct: 2, explanation: "The council-manager system originated in the Progressive Era to fight corruption. Most large Texas cities (Dallas, Austin, San Antonio, Fort Worth) use it. Bingo Review term." },
  { id: 11, category: "Local Government & Metro Politics", question: "In which city form does the mayor have broad executive responsibility over administration and implementation?", options: ["Council-manager system", "Strong mayor system", "Commission system", "Weak mayor system"], correct: 1, explanation: "In a strong mayor system, the mayor has significant executive authority. Houston is the major Texas city using this system. Bingo Review term." },
  { id: 12, category: "Local Government & Metro Politics", question: "A local institution that handles one service or policy area, such as schools, water, transit, or fire control, is called a:", options: ["Special-purpose government", "Municipal corporation", "Regional council", "Charter authority"], correct: 0, explanation: "Special-purpose governments handle one specific service. School districts and water districts are common examples. Bingo Review term." },
  { id: 13, category: "Local Government & Metro Politics", question: "Which model argues that competition among local governments can improve public goods provision as people 'vote with their feet'?", options: ["The Dillon Model", "The Tiebout Model", "The Madisonian Model", "The Wagner Model"], correct: 1, explanation: "The Tiebout Model argues residents move to communities offering the bundle of services and taxes they prefer, creating market-like pressure on local governments. Bingo Review term." },
  { id: 14, category: "Local Government & Metro Politics", question: "Which group is more likely to monitor and influence single-purpose districts because they have intense interest in a narrow issue?", options: ["Casual voters", "Political parties", "High demanders", "Average taxpayers"], correct: 2, explanation: "High demanders are intensely interested groups (parents in school districts, farmers in water districts) who dominate single-purpose elections due to low turnout. Bingo Review term." },

  { id: 15, category: "State Constitutions", question: "A state-level governing document that often includes rights, institutional rules, amendment procedures, and specific policy limits is called a:", options: ["Bill of rights", "City charter", "State constitution", "Statute book"], correct: 2, explanation: "State constitutions are the supreme law within each state, subordinate only to the U.S. Constitution. They are typically much longer and more detailed than the federal one. Bingo Review term." },
  { id: 16, category: "State Constitutions", question: "The section of many state constitutions that lists protections for individual rights and freedoms is called the:", options: ["Preamble", "State Bill of Rights", "Article of Liberties", "Reservation Clause"], correct: 1, explanation: "A state Bill of Rights lists individual rights and freedoms. Most state constitutions include one, sometimes broader than the federal version. Bingo Review term." },
  { id: 17, category: "State Constitutions", question: "A formal change to a constitution, often proposed by legislatures or voters and ratified by voters, is called a(n):", options: ["Statute", "Resolution", "Constitutional amendment", "Executive order"], correct: 2, explanation: "Constitutional amendments formally change the document. Texas's constitution has been amended hundreds of times. Bingo Review term." },
  { id: 18, category: "State Constitutions", question: "A constitutional provision that requires government to provide or protect something, such as public schools or a clean environment, is called a(n):", options: ["Reserved power", "Affirmative duty", "Police power", "Discretionary mandate"], correct: 1, explanation: "Affirmative duties require government to act, unlike negative rights that protect citizens from government. Many state constitutions impose affirmative duties on schooling and environment. Bingo Review term." },
  { id: 19, category: "State Constitutions", question: "Which states model their constitutions most closely on the U.S. Constitution by placing all executive power in the governor's hands?", options: ["Texas, California, and Florida", "Alaska, Hawaii, New Hampshire, New Jersey, and Tennessee", "New York, Ohio, and Pennsylvania", "All 50 states"], correct: 1, explanation: "Alaska, Hawaii, New Hampshire, New Jersey, and Tennessee place all executive power with the governor. Most states use split executives instead." },
  { id: 20, category: "State Constitutions", question: "Compared to the U.S. Constitution, state constitutions tend to be:", options: ["Shorter and more general", "Longer and more detailed, with more specific policy", "About the same length", "Identical in structure"], correct: 1, explanation: "State constitutions are typically much longer and contain detailed policy-specific provisions, which is part of why they're amended so often." },
  { id: 21, category: "State Constitutions", question: "The phrase 'laboratories of democracy' captures the idea that:", options: ["States must mirror federal policies exactly", "States can test different policy approaches and other states can learn from results", "Universities should design state policy", "Federal policy should be uniform across all states"], correct: 1, explanation: "Justice Brandeis's metaphor: states experiment with policies, and successful experiments can spread. Bingo Review term." },

  { id: 22, category: "State Legislatures", question: "A legislative structure with two chambers, usually an upper chamber and a lower chamber, is called:", options: ["Unicameral", "Bicameral", "Tricameral", "Monocameral"], correct: 1, explanation: "Bicameral legislatures have two chambers. Every state except Nebraska (which is unicameral) uses a bicameral system. Bingo Review term." },
  { id: 23, category: "State Legislatures", question: "A legislature with full-time members, higher pay, more staff, and greater policy capacity is called a(n):", options: ["Citizen legislature", "Amateur legislature", "Professionalized legislature", "Hybrid legislature"], correct: 2, explanation: "Professionalized legislatures (like California, New York) have full-time members and significant resources. Texas has a hybrid legislature. Bingo Review term." },
  { id: 24, category: "State Legislatures", question: "Drawing district lines to advantage one party, group, or set of incumbents is called:", options: ["Apportionment", "Reapportionment", "Gerrymandering", "Redistricting"], correct: 2, explanation: "Gerrymandering manipulates district boundaries for political advantage. Redistricting is the neutral term for drawing lines. Bingo Review term." },
  { id: 25, category: "State Legislatures", question: "The constitutional principle requiring state legislative districts to represent people equally under the Equal Protection Clause is:", options: ["Separation of powers", "One person, one vote", "Federalism", "Judicial review"], correct: 1, explanation: "One person, one vote (Reynolds v. Sims, 1964) requires districts to have roughly equal populations in both chambers. Bingo Review term." },
  { id: 26, category: "State Legislatures", question: "How long does the Texas legislature meet in regular session?", options: ["Year-round", "140 days every other year, beginning in January of odd-numbered years", "Six months every year", "Ninety days every year"], correct: 1, explanation: "Texas's legislature meets only 140 days every other year (biennial), beginning in January of odd-numbered years. One of the shortest sessions in the country." },
  { id: 27, category: "State Legislatures", question: "Which Texas official has significant legislative power as President of the state Senate?", options: ["The Speaker of the House", "The Governor", "The Lieutenant Governor", "The Attorney General"], correct: 2, explanation: "In Texas, the Lieutenant Governor presides over the state Senate and has significant control over which bills move forward. Currently this is Dan Patrick." },
  { id: 28, category: "State Legislatures", question: "How many members are in the Texas House of Representatives, and how many are in the Texas Senate?", options: ["100 House, 50 Senate", "150 House, 31 Senate", "200 House, 40 Senate", "120 House, 30 Senate"], correct: 1, explanation: "The Texas House has 150 members; the Texas Senate has 31 members." },

  { id: 29, category: "State Judiciary", question: "The authority to be the first court to hear a case is called:", options: ["Appellate jurisdiction", "Original jurisdiction", "Discretionary jurisdiction", "Concurrent jurisdiction"], correct: 1, explanation: "Original jurisdiction is the power to be the first court to hear a case. Trial courts have original jurisdiction over most cases. Bingo Review term." },
  { id: 30, category: "State Judiciary", question: "The court that hears disputes first, determines what happened, and applies legal consequences is called the:", options: ["Appellate court", "Court of last resort", "Trial court", "Supreme court"], correct: 2, explanation: "Trial courts make determinations of fact (what happened) and law (legal consequences). They are the workhorses of the state judicial system. Bingo Review term." },
  { id: 31, category: "State Judiciary", question: "The highest court in a state judicial hierarchy is called the:", options: ["Trial court", "Intermediate appellate court", "Court of last resort", "Specialized court"], correct: 2, explanation: "The court of last resort makes final decisions on state law. Most states call it the 'Supreme Court,' but Texas has TWO: the Supreme Court (civil) and the Court of Criminal Appeals. Bingo Review term." },
  { id: 32, category: "State Judiciary", question: "The institutional design question of how someone becomes a judge in the first place is called:", options: ["Judicial retention", "Judicial selection", "Judicial review", "Judicial appointment"], correct: 1, explanation: "Judicial selection is about how someone first becomes a judge. Methods include appointment, partisan/nonpartisan elections, and the Missouri Plan. Bingo Review term." },
  { id: 33, category: "State Judiciary", question: "The Missouri Plan is a system in which:", options: ["Judges are elected in partisan elections", "The legislature appoints all judges", "A governor appoints judges from a nominating commission's list, then the judge faces a retention election", "Judges serve life terms"], correct: 2, explanation: "Under the Missouri Plan, the governor selects from a pre-screened list of candidates, and the appointed judge later faces a retention election. It is the single most common system in the U.S." },
  { id: 34, category: "State Judiciary", question: "How are most Texas judges from the district level and up selected?", options: ["Appointed by the governor for life", "Selected by the Missouri Plan", "Elected in partisan judicial elections", "Appointed by the legislature"], correct: 2, explanation: "Texas uses partisan judicial elections for district judges and above. Each position on the Texas Supreme Court and Court of Criminal Appeals is a statewide partisan election." },
  { id: 35, category: "State Judiciary", question: "If you are convicted of a serious crime in a Texas trial court and lose your appeal at the intermediate appellate court, your next appeal would go to:", options: ["The Texas Supreme Court", "The Texas Court of Criminal Appeals", "A Texas County Court", "The U.S. Court of Appeals"], correct: 1, explanation: "Texas has two courts of last resort. The Texas Court of Criminal Appeals handles criminal cases; the Texas Supreme Court handles civil cases." },

  { id: 36, category: "Executive Branch", question: "The official who is the chief executive of a state and often the most visible state-level politician is the:", options: ["Lieutenant governor", "Attorney general", "Governor", "Secretary of state"], correct: 2, explanation: "The governor is the chief executive of the state, with general executive authority. Bingo Review term." },
  { id: 37, category: "Executive Branch", question: "The official who is the chief legal officer of the state and often works on consumer protection is the:", options: ["Governor", "Attorney general", "Lieutenant governor", "Secretary of state"], correct: 1, explanation: "The attorney general is the state's chief legal officer, representing the state in court and often handling consumer protection. Bingo Review term." },
  { id: 38, category: "Executive Branch", question: "The power that lets governors remove individual appropriation items from a budget bill is called the:", options: ["Pocket veto", "Line-item veto", "Executive veto", "Override"], correct: 1, explanation: "The line-item veto lets governors strip individual appropriation items from bills. 44 governors have this power; the U.S. president does not. Bingo Review term." },
  { id: 39, category: "Executive Branch", question: "A system that divides executive power among multiple significant offices instead of concentrating it in one governor is called:", options: ["Unitary executive", "Plural executive / split executives", "Council-manager", "Strong mayor"], correct: 1, explanation: "Split executives (or plural executives) divide power across multiple independently elected offices. Texas uses this system with the Governor, Lt. Governor, AG, Comptroller, etc. Bingo Review term." },
  { id: 40, category: "Executive Branch", question: "Which of the following is true about the Texas governorship?", options: ["Governors serve two-year terms with no limits", "Governors serve four-year terms with no limits on consecutive terms", "Governors are limited to two consecutive terms", "Governors are limited to a single eight-year term"], correct: 1, explanation: "Texas elects governors to four-year terms with NO limits on how many terms one person can serve. Texas is unusual in lacking term limits." },
  { id: 41, category: "Executive Branch", question: "In Texas, how can the legislature override a governor's veto?", options: ["A simple majority in both chambers", "A 2/3 supermajority in each legislative chamber", "A 3/5 supermajority in each chamber", "Only by direct citizen referendum"], correct: 1, explanation: "Texas uses the federal-style veto override: 2/3 supermajorities in both the House and Senate. In some other states, a simple majority is enough." },

  { id: 42, category: "Taxes and Spending", question: "A state fiscal rule that restricts spending so budgets usually cannot operate like the federal deficit model is a:", options: ["Continuing resolution", "Balanced budget law", "Tax expenditure limit", "Sunset provision"], correct: 1, explanation: "Balanced budget laws require revenues to cover expenses. Almost every state has one, unlike the federal government. Bingo Review term." },
  { id: 43, category: "Taxes and Spending", question: "A reserve account that saves money in prosperous years for use during fiscal downturns is called a:", options: ["Trust fund", "Rainy day fund", "Endowment fund", "Bond reserve"], correct: 1, explanation: "A rainy day fund (budget stabilization fund) saves money for downturns and emergencies. Bingo Review term." },
  { id: 44, category: "Taxes and Spending", question: "Revenues generated by taxes and fees paid within the government's jurisdiction, excluding transfers, are called:", options: ["Intergovernmental revenues", "Categorical revenues", "Own-source revenues", "Discretionary revenues"], correct: 2, explanation: "Own-source revenues are raised by the government itself through taxes and fees, distinguishing them from intergovernmental transfers. Bingo Review term." },
  { id: 45, category: "Taxes and Spending", question: "The major local revenue source tied to taxable wealth in land and buildings is the:", options: ["Sales tax", "Income tax", "Property tax", "Excise tax"], correct: 2, explanation: "Property taxes are the largest own-source revenue for local governments (over 30%). They are based on assessed market value. Bingo Review term." },
  { id: 46, category: "Taxes and Spending", question: "Which is the largest category of combined state and local government spending?", options: ["Transportation", "Education", "Public Safety", "Public Welfare"], correct: 1, explanation: "Education is the largest spending category for combined state and local government in every state. Public welfare is second." },

  { id: 47, category: "Context & Demographics", question: "Everyday services like schools, roads, utilities, policing, and fire response are usually delivered by:", options: ["Federal employees", "State employees", "Local employees", "Private contractors"], correct: 2, explanation: "Local employees deliver most everyday services. This is why state and local government matter so much in daily life. Bingo Review term." },

// ============== UTILITIES ==============
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function categoryStats(pool) {
  const qs = pool === 'easy' ? EASY_QUESTIONS : HARD_QUESTIONS;
  const cats = {};
  qs.forEach(q => { cats[q.category] = (cats[q.category] || 0) + 1; });
  return cats;
}

function formatTime(secs) {
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return m + ':' + s.toString().padStart(2, '0');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

          <div class="mode-desc">Browse all key terms. Switch between alphabetical order and the exam category breakdown.</div>

      </div>
    </div>
  `;
}

function openPool(pool) {
  state.pool = pool;
  state.view = 'menu-pool';
  renderPoolMenu();
}

function renderPoolMenu() {
  const app = document.getElementById('app');
  const pool = state.pool;
  const cats = categoryStats(pool);
  const missed = getMissedList();
  const isEasy = pool === 'easy';

  app.innerHTML = `
    <button class="btn btn-secondary" style="margin-bottom:16px;" onclick="goHome()">← Back to main menu</button>

    <div class="card">
      <h2 style="font-size:1.2rem;margin-bottom:6px;color:${isEasy ? '#60a5fa' : '#c4b5fd'};">
        ${isEasy ? 'Easy Pool (warm-up)' : 'Exam-Realistic Pool ★'}
      </h2>
      <p style="color:#94a3b8;font-size:0.9rem;margin-bottom:18px;">
        ${isEasy
          ? 'Definition-recognition questions calibrated to the Bingo Review.'
          : 'Trap distinctions, application/scenario, and Texas-specific facts. Closer to the real exam difficulty.'}
      </p>

      <div class="mode-grid">
        <button class="mode-btn" onclick="startMode('exam')">
          <div class="mode-title">Simulated Exam (40 questions)</div>
          <div class="mode-desc">40 random questions, 60-min timer.</div>
        </button>
        <button class="mode-btn" onclick="startMode('all')">
          <div class="mode-title">Full Pool (all 57)</div>
          <div class="mode-desc">Walk every question with explanations.</div>
        </button>
        <button class="mode-btn" onclick="showCategoryDrill()">
          <div class="mode-title">Drill by Category</div>
          <div class="mode-desc">Focus on one weighted topic at a time.</div>
        </button>
        <button class="mode-btn" onclick="startMode('review-missed')" ${missed.length === 0 ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>
          <div class="mode-title">Review Missed (${missed.length})</div>
          <div class="mode-desc">${missed.length === 0 ? 'Take an exam first.' : 'Re-attempt only questions you got wrong.'}</div>
        </button>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size:1.05rem;margin-bottom:12px;color:#f1f5f9;">Pool composition (57 questions)</h2>
      <div style="font-size:0.88rem;color:#cbd5e1;">
        ${Object.entries(cats).map(([c, n]) => {
          const pct = ((n / 57) * 100).toFixed(1);
          return '<div class="breakdown-row"><span>' + escapeHtml(c) + '</span><span>' + n + ' q (' + pct + '%)</span></div>';
        }).join('')}
      </div>
    </div>
  `;
}

function showCategoryDrill() {
  const app = document.getElementById('app');
  const cats = categoryStats(state.pool);
  app.innerHTML = `
    <button class="btn btn-secondary" style="margin-bottom:16px;" onclick="renderPoolMenu()">← Back</button>
    <div class="card">
      <h2 style="font-size:1.2rem;margin-bottom:14px;color:#f1f5f9;">Drill by Category (${state.pool === 'easy' ? 'Easy' : 'Exam-Realistic'})</h2>
      <div class="category-grid">
        ${Object.entries(cats).map(([c, n]) => `
          <button class="cat-btn" onclick="startCategory('${c.replace(/'/g, "\\'")}')">
            <div class="cat-name">${escapeHtml(c)}</div>
            <div class="cat-count">${n} questions</div>
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

function renderQuestion(app) {
  const q = state.questions[state.currentIdx];
  if (!q) return;
  const total = state.questions.length;
  const progress = ((state.currentIdx + 1) / total) * 100;
  const timerHTML = state.mode === 'exam'
    ? '<div class="timer ' + (state.timeRemaining < 300 ? 'warning' : '') + '" id="timer">' + formatTime(state.timeRemaining) + '</div>'
    : '';

  const poolBadge = state.pool === 'hard'
    ? '<span style="background:#7c3aed;color:#fff;padding:3px 8px;border-radius:4px;font-size:0.75rem;font-weight:600;">EXAM-REALISTIC</span>'
    : '<span style="background:#3b82f6;color:#fff;padding:3px 8px;border-radius:4px;font-size:0.75rem;font-weight:600;">EASY</span>';

  app.innerHTML = `
    <div class="header-bar">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <button class="btn btn-secondary" onclick="confirmExit()">← Exit</button>
        ${poolBadge}
      </div>
      ${timerHTML}
    </div>
    <div class="progress"><div class="progress-bar" style="width:${progress}%"></div></div>
    <div class="progress-text">
      <span>Question ${state.currentIdx + 1} of ${total}</span>
      <span>${state.answers.filter(a => a.correct).length} correct so far</span>
    </div>

    <div class="card">
      <div class="question-meta">${escapeHtml(q.category)}</div>
      <div class="question-text">${escapeHtml(q.question)}</div>
      <div class="options">
        ${q.options.map((opt, i) => {
          let cls = 'option';
          if (state.answered) {
            if (i === q.correct) cls += ' correct';
            else if (i === state.selected) cls += ' incorrect';
          } else if (i === state.selected) {
            cls += ' selected';
          }
          return '<button class="' + cls + '" onclick="selectOption(' + i + ')" ' + (state.answered ? 'disabled' : '') + '>' + String.fromCharCode(65 + i) + '. ' + escapeHtml(opt) + '</button>';
        }).join('')}
      </div>
      ${state.answered ? `
        <div class="explanation">
          <strong>${state.selected === q.correct ? '✓ Correct' : '✗ Incorrect'}.</strong> ${escapeHtml(q.explanation)}
        </div>
      ` : ''}
      <div class="actions">
        ${state.answered
          ? '<button class="btn" onclick="nextQuestion()">' + (state.currentIdx + 1 === total ? 'See Results' : 'Next →') + '</button>'
          : '<button class="btn" onclick="submitAnswer()" ' + (state.selected === null ? 'disabled' : '') + '>Submit Answer</button>'
        }
      </div>
    </div>
  `;
}

function renderResults(app) {
  const total = state.questions.length;
  const correct = state.answers.filter(a => a.correct).length;
  const pct = Math.round((correct / total) * 100);
  const missed = state.answers.filter(a => !a.correct);
  const poolQs = getPoolQuestions();

  const catResults = {};
  state.answers.forEach(a => {
    const q = poolQs.find(x => x.id === a.qid);
    if (!q) return;
    if (!catResults[q.category]) catResults[q.category] = { right: 0, total: 0 };
    catResults[q.category].total++;
    if (a.correct) catResults[q.category].right++;
  });

  const elapsed = state.startTime ? Math.round((Date.now() - state.startTime) / 1000) : 0;
  const poolLabel = state.pool === 'hard' ? 'Exam-Realistic' : 'Easy';

  app.innerHTML = `
    <div class="card">
      <div style="text-align:center;color:#94a3b8;font-size:0.85rem;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;">${poolLabel} Pool</div>
      <div class="results-summary">
        <div class="score ${pct >= 70 ? 'pass' : 'fail'}">${pct}%</div>
        <div class="score-label">${correct} / ${total} correct</div>
        <div style="color:#94a3b8;font-size:0.9rem;">Time: ${formatTime(elapsed)}</div>
      </div>

      <div class="stats-row">
        <div class="stat-box"><div class="stat-num pass">${correct}</div><div class="stat-lbl">Correct</div></div>
        <div class="stat-box"><div class="stat-num fail">${total - correct}</div><div class="stat-lbl">Missed</div></div>
        <div class="stat-box"><div class="stat-num">${pct}%</div><div class="stat-lbl">Score</div></div>
      </div>

      <h3 style="font-size:1.05rem;margin:20px 0 10px;color:#f1f5f9;">Category Breakdown</h3>
      <div class="breakdown">
        ${Object.entries(catResults).map(([c, r]) => {
          const p = Math.round((r.right / r.total) * 100);
          const cls = p >= 80 ? 'pct-good' : p >= 60 ? 'pct-mid' : 'pct-bad';
          return '<div class="breakdown-row"><span>' + escapeHtml(c) + '</span><span class="' + cls + '">' + r.right + '/' + r.total + ' (' + p + '%)</span></div>';
        }).join('')}
      </div>

      <div class="actions">
        <button class="btn" onclick="goHome()">Main Menu</button>
        <button class="btn btn-secondary" onclick="renderPoolMenu(); state.view='menu-pool';">Back to Pool Menu</button>
        ${missed.length > 0 ? '<button class="btn btn-secondary" onclick="reviewSession()">Review ' + missed.length + ' Missed</button>' : ''}
        <button class="btn btn-secondary" onclick="restartSame()">Retry Same Mode</button>
      </div>
    </div>

    ${missed.length > 0 ? `
      <div class="card">
        <h3 style="font-size:1.05rem;margin-bottom:14px;color:#f1f5f9;">Questions You Missed</h3>
        ${missed.map(a => {
          const q = poolQs.find(x => x.id === a.qid);
          return `
            <div class="review-q">
              <div class="review-q-num">${escapeHtml(q.category)}</div>
              <div class="review-q-text">${escapeHtml(q.question)}</div>
              <div class="review-answer review-wrong">Your answer: ${escapeHtml(q.options[a.selected])}</div>
              <div class="review-answer review-correct">Correct: ${escapeHtml(q.options[q.correct])}</div>
              <div class="review-answer" style="margin-top:8px;color:#cbd5e1;">${escapeHtml(q.explanation)}</div>
            </div>
          `;
        }).join('')}
      </div>
    ` : ''}
  `;
}

function renderTerms(app) {
  const filter = state.termsFilter.toLowerCase();
  const filtered = filter
    ? TERMS.filter(t => t.term.toLowerCase().includes(filter) || t.definition.toLowerCase().includes(filter) || t.category.toLowerCase().includes(filter))
    : TERMS;

  let bodyHTML = '';
  if (state.termsView === 'alpha') {
    const sorted = [...filtered].sort((a, b) => a.term.localeCompare(b.term));
    // Group by first letter
    const byLetter = {};
    sorted.forEach(t => {
      const letter = t.term[0].toUpperCase();
      if (!byLetter[letter]) byLetter[letter] = [];
      byLetter[letter].push(t);
    });
    bodyHTML = Object.entries(byLetter).map(([letter, terms]) => `
      <div style="margin-bottom:18px;">
        <div style="font-size:1.3rem;font-weight:700;color:#60a5fa;border-bottom:2px solid #334155;padding-bottom:4px;margin-bottom:10px;">${letter}</div>
        ${terms.map(t => `
          <div class="term-card">
            <div class="term-name">${escapeHtml(t.term)}</div>
            <div class="term-cat">${escapeHtml(t.category)}</div>
            <div class="term-def">${escapeHtml(t.definition)}</div>
          </div>
        `).join('')}
      </div>
    `).join('');
  } else {
    // by category, in the order of the exam weighting
    const order = [
      'Federalism',
      'Local Government & Metro Politics',
      'State Constitutions',
      'State Legislatures',
      'State Judiciary',
      'Executive Branch',
      'Taxes and Spending',
      'Context & Demographics',
      'Public Opinion & Lobbying',
      'Participation & Elections',
    ];
    const weights = {
      'Federalism': '12.8%',
      'Local Government & Metro Politics': '12.8%',
      'State Constitutions': '11.5%',
      'State Legislatures': '11.5%',
      'State Judiciary': '11.5%',
      'Executive Branch': '10.3%',
      'Taxes and Spending': '9.0%',
      'Context & Demographics': '7.7%',
      'Public Opinion & Lobbying': '6.4%',
      'Participation & Elections': '5.1%',
    };
    bodyHTML = order.map(cat => {
      const terms = filtered.filter(t => t.category === cat);
      if (terms.length === 0) return '';
      return `
        <div style="margin-bottom:22px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #334155;padding-bottom:6px;margin-bottom:12px;">
            <div style="font-size:1.15rem;font-weight:700;color:#60a5fa;">${escapeHtml(cat)}</div>
            <div style="font-size:0.85rem;color:#94a3b8;">${weights[cat]} of exam · ${terms.length} terms</div>
          </div>
          ${terms.map(t => `
            <div class="term-card">
              <div class="term-name">${escapeHtml(t.term)}</div>
              <div class="term-def">${escapeHtml(t.definition)}</div>
            </div>
          `).join('')}
        </div>
      `;
    }).join('');
  }

  app.innerHTML = `
    <button class="btn btn-secondary" style="margin-bottom:12px;" onclick="goHome()">← Main menu</button>

    <div class="card" style="position:sticky;top:8px;z-index:10;">
      <h2 style="font-size:1.2rem;margin-bottom:12px;color:#bbf7d0;">Terms & Definitions Review</h2>
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
        <button class="btn ${state.termsView === 'alpha' ? '' : 'btn-secondary'}" onclick="setTermsView('alpha')">Alphabetical</button>
        <button class="btn ${state.termsView === 'category' ? '' : 'btn-secondary'}" onclick="setTermsView('category')">By Exam Category</button>
      </div>
      <input type="text" id="terms-search" placeholder="Search terms or definitions..." value="${escapeHtml(state.termsFilter)}"
        oninput="state.termsFilter = this.value; renderTermsKeepFocus();"
        style="width:100%;padding:10px 12px;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:6px;font-size:0.92rem;">
      <div style="margin-top:8px;color:#94a3b8;font-size:0.82rem;">${filtered.length} of ${TERMS.length} terms${filter ? ' (filtered)' : ''}</div>
    </div>

    <div class="card" style="margin-top:12px;">
      ${bodyHTML || '<div style="color:#94a3b8;text-align:center;padding:40px;">No terms match your filter.</div>'}
    </div>
  `;
}

function renderTermsKeepFocus() {
  // Re-render but try to preserve search input focus and cursor position
  const input = document.getElementById('terms-search');
  const pos = input ? input.selectionStart : null;
  renderTerms(document.getElementById('app'));
  const newInput = document.getElementById('terms-search');
  if (newInput && pos !== null) {
    newInput.focus();
    try { newInput.setSelectionRange(pos, pos); } catch(e) {}
  }
}

function setTermsView(v) {
  state.termsView = v;
  render();
}

function openTermsPage() {
  state.view = 'terms-page';
  state.termsFilter = '';
  render();
}

// ============== MODE STARTERS ==============
function startMode(mode) {
  const pool = getPoolQuestions();
  state.mode = mode;
  state.view = 'quiz';
  if (mode === 'exam') {
    state.questions = shuffle(pool).slice(0, 40);
    state.timeRemaining = 60 * 60;
    startTimer();
  } else if (mode === 'all') {
    state.questions = shuffle(pool);
  } else if (mode === 'review-missed') {
    const missed = getMissedList();
    state.questions = shuffle(pool.filter(q => missed.includes(q.id)));
  }
  state.currentIdx = 0;
  state.selected = null;
  state.answered = false;
  state.answers = [];
  state.startTime = Date.now();
  render();
}

function startCategory(cat) {
  const pool = getPoolQuestions();
  state.mode = 'category';
  state.view = 'quiz';
  state.questions = shuffle(pool.filter(q => q.category === cat));
  state.currentIdx = 0;
  state.selected = null;
  state.answered = false;
  state.answers = [];
  state.startTime = Date.now();
  render();
}

function reviewSession() {
  const missedIds = state.answers.filter(a => !a.correct).map(a => a.qid);
  const pool = getPoolQuestions();
  state.mode = 'review-missed';
  state.view = 'quiz';
  state.questions = shuffle(pool.filter(q => missedIds.includes(q.id)));
  state.currentIdx = 0;
  state.selected = null;
  state.answered = false;
  state.answers = [];
  state.startTime = Date.now();
  render();
}

function restartSame() {
  startMode(state.mode);
}

// ============== INTERACTIONS ==============
function selectOption(i) {
  if (state.answered) return;
  state.selected = i;
  render();
}

function submitAnswer() {
  if (state.selected === null) return;
  const q = state.questions[state.currentIdx];
  const isCorrect = state.selected === q.correct;
  state.answers.push({ qid: q.id, selected: state.selected, correct: isCorrect });
  if (!isCorrect) addToMissed(q.id);
  state.answered = true;
  render();
}

function nextQuestion() {
  if (state.currentIdx + 1 >= state.questions.length) {
    finishSession();
    return;
  }
  state.currentIdx++;
  state.selected = null;
  state.answered = false;
  render();
}

function finishSession() {
  stopTimer();
  state.view = 'results';
  render();
}

function confirmExit() {
  if (state.answers.length > 0 && !confirm("Exit and lose this session's progress?")) return;
  stopTimer();
  state.view = 'menu-pool';
  renderPoolMenu();
}

function goHome() {
  stopTimer();
  state.view = 'menu';
  state.mode = null;
  state.currentIdx = 0;
  state.selected = null;
  state.answered = false;
  state.answers = [];
  state.questions = [];
  render();
}

// ============== TIMER ==============
function startTimer() {
  stopTimer();
  state.timerInterval = setInterval(() => {
    state.timeRemaining--;
    const t = document.getElementById('timer');
    if (t) {
      t.textContent = formatTime(state.timeRemaining);
      if (state.timeRemaining < 300) t.classList.add('warning');
    }
    if (state.timeRemaining <= 0) {
      stopTimer();
      alert('Time is up. Submitting your exam.');
      finishSession();
    }
  }, 1000);
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

// ============== INIT ==============
render();
</script>
</body>
</html>
